architecture:
  # ============================================================
  # Architecture Description (derived from inputs_my/arch.yaml)
  # Config: eyeriss-like
  # ============================================================
  version: 0.4
  nodes: # Top-level is hierarchical
  - !Container # Top-level system
    name: system

  - !Component # DRAM main memory
    name: DRAM
    class: DRAM
    attributes:
      type: "LPDDR4"
      width: 2048
      datawidth: 8
      depth: 2147483648

  - !Container # Accelerator
    name: eyeriss
    attributes:
      technology: "65nm"

  - !Component # Global buffer for inputs & outputs
    name: shared_glb
    class: smartbuffer_SRAM
    attributes:
      depth: 20736
      width: 64
      n_banks: 40
      datawidth: 8

  - !Container # PE Array 
    name: PEy
    spatial: {meshX: 16}

  - !Container # PE Array 
    name: PE
    spatial: {meshY: 16}

  - !Component # Output scratchpad
    name: regfile
    class: smartbuffer_RF
    attributes:
      depth: 212
      width: 16
      datawidth: 8

  - !Component # MAC unit
    name: mac
    class: intmac
    attributes:
      multiplier_width: 8
      adder_width: 16
