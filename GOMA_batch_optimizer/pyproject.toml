[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goma-batch-extension"
version = "0.1.0"
description = "Certified batch-level allocation and joint mapping for GOMA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
solver = ["gurobipy==13.0.0"]
test = ["pytest>=7"]

[project.scripts]
goma-batch = "goma_batch.cli:main"

[tool.setuptools.packages.find]
include = ["goma_batch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gurobi: requires Gurobi and an appropriate license"]
